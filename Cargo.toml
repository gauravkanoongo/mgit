[package]
name = "mgit"
version = "0.2.0"
authors = ["Jan van den Berg <rust@koozz.nl>"]
license = "MIT"
description = "Fast, async parallel git execution across multiple repositories with deterministic ordering."
keywords = ["cli", "git", "parallel", "async"]
categories = ["command-line-interface", "command-line-utilities"]
homepage = "https://github.com/koozz/mgit"
repository = "https://github.com/koozz/mgit"
readme = "README.md"
edition = "2024"

[dependencies]
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "process", "sync", "time"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lexopt = "0.3"
walkdir = "2.5"
num_cpus = "1.16"
anstream = "0.6"
anstyle = "1.0"

# Retain existing dependencies while migrating other phases
termcolor = "1.4"
threadpool = "1.8"

[dev-dependencies]
tempfile = "3.17"
